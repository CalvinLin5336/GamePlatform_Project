spring.application.name=gameplatform

server.port=${PORT:8080}

# SQLite
spring.datasource.url=jdbc:sqlite:gameplatform.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
# 本機開發預設值；正式環境由 application-prod.properties 強制讀取 JWT_SECRET。
jwt.secret=${JWT_SECRET:gameplatform-jwt-secret-key-2026-change-this-key}

# 正式部署由 Spring Boot 同源提供前端；此設定只保留本機 Live Server 開發用途。
# 若另有正式前端網域，請用環境變數 CORS_ALLOWED_ORIGIN_PATTERNS 明確指定。
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
