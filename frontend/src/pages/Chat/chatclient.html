<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <title>遊戲主畫面與系統選單</title>
        <meta charset="UTF-8">      
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
        <style>body { font-family: 'Noto Sans TC', sans-serif; }</style>
        <!-- 載入 jQuery 核心 -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>
    <body class="relative h-screen w-screen overflow-hidden bg-slate-950 flex flex-col">

        <!-- ================= 1. 頂部導覽列 (Navigation Bar) ================= -->
        <header class="h-14 bg-slate-900/70 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-6 z-40 select-none">
            <!-- 左側：遊戲Logo或名稱 -->
            <div class="flex items-center gap-3">
                <span class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    🎮 遊戲對戰平台
                </span>
            </div>

            <!-- 右側群組：分頁按鈕 + 使用者登入狀態 -->
            <div class="flex items-center">
                
                <!-- 原本的導覽列按鈕 -->
                <nav class="flex items-center gap-2 pr-4 border-r border-slate-700 mr-4">
                    <button onclick="switchTab('lobby', '../lobby/jquery_lobby.html')" 
                            class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition active:scale-95 bg-slate-800 text-white" data-target="lobby">
                        🏠 遊戲大廳
                    </button>
                    <button onclick="switchTab('party', '../board/index.html')" 
                            class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition active:scale-95" data-target="party">
                        👥 組隊布告欄
                    </button>
                    <button onclick="switchTab('shop', 'https://example.com/shop')" 
                            class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition active:scale-95" data-target="shop">
                        🛒 商城
                    </button>
                    <button onclick="switchTab('member', '../User/Login/login.html')"
                            class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition active:scale-95" data-target="member">
                        ⚙️ 會員中心
                    </button>
                </nav>

                <!-- 使用者狀態區 -->
                <div id="userStatusArea" class="flex items-center">
                    
                    <!-- 狀態 A：未登入 (預設顯示) -->
                    <div id="loggedOutView" class="flex items-center gap-3">
                        <span class="text-sm text-slate-400">尚未登入</span>
                        <button onclick="switchTab('member', '../User/Login/login.html')" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded transition shadow-lg shadow-indigo-500/20">
                            前往登入
                        </button>
                    </div>

                    <!-- 狀態 B：已登入 (預設隱藏 hidden) -->
                    <div id="loggedInView" class="hidden items-center gap-3">
                        <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition" title="前往會員中心" onclick="switchTab('member', '../User/Login/login.html')">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-white text-sm shadow-md">
                                👤
                            </div>
                            <span id="displayUserName" class="text-sm font-bold text-slate-200"></span>
                        </div>
                        <button id="logoutBtn" class="text-xs border border-slate-600 text-slate-400 hover:text-white hover:bg-slate-700 px-3 py-1.5 rounded transition">
                            登出
                        </button>
                    </div>

                </div>
            </div>
        </header>


        <!-- ================= 2. 內容主畫面區 ================= -->
        <main class="relative flex-1 w-full h-full overflow-hidden z-0">
            <iframe id="mainFrame" src="../Games/tjpoker/poker_client.html" class="w-full h-full border-0"></iframe>
        </main>


        <!-- ================= 3. 右下角懸浮聊天室 ================= -->
        <div class="absolute bottom-5 right-5 z-50 flex flex-col items-end">
            <!-- 聊天室本體容器 -->
            <div id="chatWindow" class="w-80 sm:w-96 h-[480px] bg-slate-900/80 backdrop-blur-xl border border-slate-700/60 shadow-2xl rounded-2xl flex flex-col overflow-hidden transition-all duration-300 origin-bottom-right scale-0 opacity-0 pointer-events-none mb-3">
                <div class="p-3 bg-slate-900/60 border-b border-slate-700/50 flex justify-between items-center">
                    <h1 class="font-bold text-sm tracking-wider bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                        🚀 遊戲即時聊天室
                    </h1>
                    <button id="closeChatBtn" class="text-slate-400 hover:text-white text-xs px-2 py-1 rounded bg-slate-800 transition">✕ 縮小</button>
                </div>
                <div class="p-3 bg-slate-900/30 border-b border-slate-700/40 flex flex-col gap-2">
                    <div class="flex justify-between items-center text-xs">
                        <span id="infoWindow" class="text-slate-400">狀態：未登入</span>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="userNameInput" placeholder="輸入暱稱..." class="flex-1 bg-slate-900/60 border border-slate-700 rounded px-2.5 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"/>
                        <input type="button" id="loginBtn" value="登入" class="bg-indigo-600 hover:bg-indigo-500 cursor-pointer text-white text-xs font-medium px-3 py-1 rounded transition disabled:opacity-50"/>
                    </div>
                </div>
                <div id="messageDisplay" class="flex-1 p-3 overflow-y-auto flex flex-col gap-2 text-xs text-slate-200"></div>
                <form id="chatRoomForm" class="p-2.5 bg-slate-900/50 border-t border-slate-700/50 flex gap-2">
                    <input type="text" id="userinput" placeholder="說點什麼..." class="flex-1 bg-slate-900/60 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500"/>
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 cursor-pointer text-white text-xs font-medium px-3 py-1.5 rounded transition">發送</button>
                </form>
            </div>

            <button id="toggleChatBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3.5 rounded-full shadow-lg shadow-indigo-500/30 flex items-center justify-center transition hover:scale-105 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </button>
        </div>


        <!-- ================= 4. 互動控制 Script ================= -->
        <script>
            // --- 頁面切換邏輯 ---
            const mainFrame = document.getElementById('mainFrame');
            const navButtons = document.querySelectorAll('.nav-btn');

            function switchTab(tabName, url) {
                mainFrame.src = url;

                navButtons.forEach(btn => {
                    if (btn.getAttribute('data-target') === tabName) {
                        btn.classList.add('bg-slate-800', 'text-white');
                        btn.classList.remove('text-slate-300');
                    } else {
                        btn.classList.remove('bg-slate-800', 'text-white');
                        btn.classList.add('text-slate-300');
                    }
                });
            }

            // --- 聊天室開合邏輯 ---
            const toggleChatBtn = document.getElementById('toggleChatBtn');
            const closeChatBtn = document.getElementById('closeChatBtn');
            const chatWindow = document.getElementById('chatWindow');

            toggleChatBtn.addEventListener('click', () => {
                chatWindow.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                chatWindow.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
                toggleChatBtn.classList.add('hidden');
            });

            closeChatBtn.addEventListener('click', () => {
                chatWindow.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
                chatWindow.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                toggleChatBtn.classList.remove('hidden');
            });

            // --- 🌟 右上角與聊天室同步登入狀態邏輯 (對齊 'account') ---
            const loggedOutView = document.getElementById('loggedOutView');
            const loggedInView = document.getElementById('loggedInView');
            const displayUserName = document.getElementById('displayUserName');
            const logoutBtn = document.getElementById('logoutBtn');

            function checkLoginStatus() {
                const currentAccount = localStorage.getItem("account");

                if (currentAccount) {
                    // 1. 更新右上角介面
                    displayUserName.textContent = currentAccount;
                    loggedOutView.classList.add('hidden');
                    loggedInView.classList.remove('hidden');
                    loggedInView.classList.add('flex');

                    // 2. 同步更新右下角聊天室介面狀態
                    const infoWindow = document.getElementById('infoWindow');
                    const userNameInput = document.getElementById('userNameInput');
                    const loginBtn = document.getElementById('loginBtn');
                    
                    if (infoWindow) infoWindow.textContent = "狀態：已登入 (" + currentAccount + ")";
                    if (userNameInput) {
                        userNameInput.value = currentAccount;
                        userNameInput.disabled = true;
                    }
                    if (loginBtn) {
                        loginBtn.value = "已登入";
                        loginBtn.disabled = true;
                    }

                } else {
                    // 未登入狀態
                    loggedInView.classList.add('hidden');
                    loggedInView.classList.remove('flex');
                    loggedOutView.classList.remove('hidden');
                }
            }

            logoutBtn.addEventListener('click', () => {
                if (confirm('確定要登出嗎？')) {
                    if (typeof UserApi !== 'undefined' && UserApi.clearLoginSession) {
                        UserApi.clearLoginSession();
                    } else {
                        localStorage.removeItem("token");
                        localStorage.removeItem("account");
                        localStorage.removeItem("userId");
                        localStorage.removeItem("username");
                        localStorage.removeItem("role");
                        localStorage.removeItem("status");
                    }
                    
                    checkLoginStatus();
                    
                    // 重置聊天室狀態
                    document.getElementById('infoWindow').textContent = "狀態：未登入";
                    const userNameInput = document.getElementById('userNameInput');
                    const loginBtn = document.getElementById('loginBtn');
                    if (userNameInput) { userNameInput.value = ""; userNameInput.disabled = false; }
                    if (loginBtn) { loginBtn.value = "登入"; loginBtn.disabled = false; }

                    alert('已成功登出！');
                    window.location.reload();
                }
            });

            // 網頁一載入時，立刻執行一次狀態檢查
            checkLoginStatus();

            // 監聽 localStorage 變更（支援跨分頁同步）
            window.addEventListener('storage', (event) => {
                if (event.key === 'account') {
                    checkLoginStatus();
                }
            });

// --- 🌟 聊天室表單送出與訊息渲染 ---
            $('#chatRoomForm').on('submit', function (event) {
                event.preventDefault(); // 阻止表單預設提交與頁面重新整理

                const messageInput = $('#userinput');
                const messageText = messageInput.val().trim();
                const currentAccount = localStorage.getItem("account") || "訪客";

                if (!messageText) return;

                // 1. 動態建立一則訊息的 HTML 結構 (你可以根據你們聊天室原本的樣式微調)
                const messageHtml = `
                    <div class="flex flex-col bg-slate-800/60 p-2 rounded-lg">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-indigo-400">${currentAccount}</span>
                            <span class="text-[10px] text-slate-500">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                        <span class="text-slate-200 break-words">${escapeHtml(messageText)}</span>
                    </div>
                `;

                // 2. 將訊息塞進顯示區
                $('#messageDisplay').append(messageHtml);

                // 3. 讓聊天室自動捲動到最底部，看得到最新訊息
                const displayArea = document.getElementById('messageDisplay');
                displayArea.scrollTop = displayArea.scrollHeight;

                // 4. 清空輸入框
                messageInput.val('');

                // 💡 之後如果串接 WebSocket，發送邏輯可以直接寫在這邊：
                // if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                //     chatSocket.send(JSON.stringify({ sender: currentAccount, content: messageText }));
                // }
            });

            // 輔助函式：防止 HTML 標籤隱碼攻擊 (XSS 簡單防護)
            function escapeHtml(text) {
                return $('<div>').text(text).html();
            }
        </script>
    </body>
</html>
