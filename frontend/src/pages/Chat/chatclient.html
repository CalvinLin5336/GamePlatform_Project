<!DOCTYPE html>
<html lang="zh-TW">
    <head>
        <title>遊戲主畫面與系統選單</title>
        <meta charset="UTF-8">      
        <script src="https://cdn.tailwindcss.com"></script>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
        <style>body { font-family: 'Noto Sans TC', sans-serif; }</style>
        <!-- 載入 jQuery 核心 -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>
    <body class="relative h-screen w-screen overflow-hidden bg-slate-950 flex flex-col">

        <!-- ================= 1. 頂部導覽列 (Navigation Bar) ================= -->
        <header class="h-14 bg-slate-900/70 backdrop-blur-md border-b border-slate-800 flex items-center justify-between px-6 z-40 select-none">
            <!-- 左側：遊戲Logo或名稱 -->
            <div class="flex items-center gap-3">
                <span class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    🎮 遊戲對戰平台
                </span>
            </div>

            <!-- 右側群組：分頁按鈕 + 使用者登入狀態 -->
            <div class="flex items-center">
                
                <nav class="flex items-center gap-2 pr-4 border-r border-slate-700 mr-4">
                    <button onclick="switchTab('lobby', '../lobby/jquery_lobby.html')" 
                            class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition active:scale-95 bg-slate-800 text-white" data-target="lobby">
                        🏠 遊戲大廳
                    </button>
                    <button onclick="switchTab('party', '../board/index.html')" 
                            class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition active:scale-95" data-target="party">
                        👥 組隊布告欄
                    </button>
                    <button onclick="switchTab('shop', '../Shop/wait.html')" 
                            class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition active:scale-95" data-target="shop">
                        🛒 商城
                    </button>
                    <button onclick="switchTab('member', '../User/Login/login.html')"
                            class="nav-btn px-4 py-1.5 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800 transition active:scale-95" data-target="member">
                        ⚙️ 會員中心
                    </button>
                </nav>

                <!-- 使用者狀態區 -->
                <div id="userStatusArea" class="flex items-center">
                    
                    <div id="loggedOutView" class="flex items-center gap-3">
                        <span class="text-sm text-slate-400">尚未登入</span>
                        <button onclick="switchTab('member', '../User/Login/login.html')" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded transition shadow-lg shadow-indigo-500/20">
                            前往登入
                        </button>
                    </div>

                    <div id="loggedInView" class="hidden items-center gap-3">
                        <div class="flex items-center gap-2 cursor-pointer hover:opacity-80 transition" title="前往會員中心" onclick="switchTab('member', '../User/Login/login.html')">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-cyan-400 flex items-center justify-center text-white text-sm shadow-md">
                                👤
                            </div>
                            <span id="displayUserName" class="text-sm font-bold text-slate-200"></span>
                        </div>
                        <button id="logoutBtn" class="text-xs border border-slate-600 text-slate-400 hover:text-white hover:bg-slate-700 px-3 py-1.5 rounded transition">
                            登出
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- ================= 2. 內容主畫面區 (載入其他網頁的 iframe) ================= -->
        <main class="relative flex-1 w-full h-full overflow-hidden z-0">
            <!-- 預設載入大廳 -->
            <iframe id="mainFrame" src="../User/Login/login.html" class="w-full h-full border-0"></iframe>
        </main>

        <!-- ================= 3. 右下角懸浮聊天室 (大廳 + 房間 整合版) ================= -->
        <div class="absolute bottom-5 right-5 z-50 flex flex-col items-end pointer-events-none">
            
            <div id="chatWindow" class="w-80 sm:w-96 h-[480px] bg-slate-900/80 backdrop-blur-xl border border-slate-700/60 shadow-2xl rounded-2xl flex flex-col overflow-hidden transition-all duration-300 origin-bottom-right scale-0 opacity-0 pointer-events-none mb-3">
                
                <div class="p-2 bg-slate-900/60 border-b border-slate-700/50 flex justify-between items-center">
                    <div class="flex gap-2">
                        <button id="tabLobbyChat" class="text-xs px-3 py-1.5 rounded bg-indigo-600 text-white font-bold transition shadow-sm pointer-events-auto">大廳</button>
                        <button id="tabRoomChat" class="hidden text-xs px-3 py-1.5 rounded bg-slate-800 text-slate-400 font-bold transition hover:bg-slate-700 pointer-events-auto">房間</button>
                    </div>
                    <button id="closeChatBtn" class="pointer-events-auto text-slate-400 hover:text-white text-xs px-2 py-1 rounded bg-slate-800 transition">✕ 縮小</button>
                </div>
                
                <div id="messageDisplayLobby" class="flex-1 p-3 overflow-y-auto flex flex-col gap-2 text-xs text-slate-200 pointer-events-auto"></div>
                <div id="messageDisplayRoom" class="hidden flex-1 p-3 overflow-y-auto flex flex-col gap-2 text-xs text-slate-200 pointer-events-auto"></div>
                
                <form id="chatRoomForm" class="p-2.5 bg-slate-900/50 border-t border-slate-700/50 flex gap-2 pointer-events-auto">
                    <input type="text" id="userinput" placeholder="說點什麼..." class="flex-1 bg-slate-900/60 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-indigo-500" autocomplete="off"/>
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 cursor-pointer text-white text-xs font-medium px-3 py-1.5 rounded transition">發送</button>
                </form>
            </div>

            <button id="toggleChatBtn" class="pointer-events-auto bg-indigo-600 hover:bg-indigo-500 text-white p-3.5 rounded-full shadow-lg shadow-indigo-500/30 flex items-center justify-center transition hover:scale-105 active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
            </button>
        </div>

        <!-- ================= 4. 互動控制 Script ================= -->
        <script>
            const mainFrame = document.getElementById('mainFrame');
            const navButtons = document.querySelectorAll('.nav-btn');

            function switchTab(tabName, url) {
                // 🌟 如果當前 iframe 有 forceLeaveRoom 函數，就主動呼叫要求離開

                try {
                    if (mainFrame.contentWindow && typeof mainFrame.contentWindow.forceLeaveRoom === 'function') {
                        // 傳入 false，觸發上方的「情況 A」
                        mainFrame.contentWindow.forceLeaveRoom(false);
                    }
                } catch (e) {
                    // 忽略跨域錯誤
                }

                mainFrame.src = url;

                navButtons.forEach(btn => {
                    if (btn.getAttribute('data-target') === tabName) {
                        btn.classList.add('bg-slate-800', 'text-white');
                        btn.classList.remove('text-slate-300');
                    } else {
                        btn.classList.remove('bg-slate-800', 'text-white');
                        btn.classList.add('text-slate-300');
                    }
                });
            }

            const toggleChatBtn = document.getElementById('toggleChatBtn');
            const closeChatBtn = document.getElementById('closeChatBtn');
            const chatWindow = document.getElementById('chatWindow');

            toggleChatBtn.addEventListener('click', () => {
                chatWindow.classList.remove('scale-0', 'opacity-0', 'pointer-events-none');
                chatWindow.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');
                toggleChatBtn.classList.add('hidden');
            });

            closeChatBtn.addEventListener('click', () => {
                chatWindow.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
                chatWindow.classList.add('scale-0', 'opacity-0', 'pointer-events-none');
                toggleChatBtn.classList.remove('hidden');
            });

            const loggedOutView = document.getElementById('loggedOutView');
            const loggedInView = document.getElementById('loggedInView');
            const displayUserName = document.getElementById('displayUserName');
            const logoutBtn = document.getElementById('logoutBtn');

            function checkLoginStatus() {
                const currentAccount = localStorage.getItem("account");
                const currentUsername = localStorage.getItem("username") || currentAccount;

                if (currentAccount) {
                    displayUserName.textContent = currentUsername;
                    loggedOutView.classList.add('hidden');
                    loggedInView.classList.remove('hidden');
                    loggedInView.classList.add('flex');
                } else {
                    loggedInView.classList.add('hidden');
                    loggedInView.classList.remove('flex');
                    loggedOutView.classList.remove('hidden');
                }
            }

            logoutBtn.addEventListener('click', () => {
                if (confirm('確定要登出嗎？')) {
                    if (typeof UserApi !== 'undefined' && UserApi.clearLoginSession) {
                        UserApi.clearLoginSession();
                    } else {
                        localStorage.removeItem("token");
                        localStorage.removeItem("account");
                        localStorage.removeItem("userId");
                        localStorage.removeItem("username");
                        localStorage.removeItem("role");
                        localStorage.removeItem("status");
                    }
                    
                    checkLoginStatus();
                    alert('已成功登出！');
                    window.location.reload();
                }
            });

            checkLoginStatus();

            window.addEventListener('storage', (event) => {
                if (event.key === 'account' || event.key === 'username') {
                    checkLoginStatus();
                }
            });
        </script>
        
       <script src="./js/client.js"></script>
    </body>
</html>
