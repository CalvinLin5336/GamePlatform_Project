<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊戲大廳 (全動態資料版)</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 jQuery 核心 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-full flex flex-col items-center py-10 font-sans overflow-y-auto">

    <!-- ================= 主畫面區 ================= -->
    <div class="w-full max-w-5xl px-8 flex flex-col items-center">
        
        <!-- 🌟 頂部分頁按鈕區塊 -->
        <div class="flex justify-center gap-4 mb-8 bg-slate-900 p-2 rounded-full border border-slate-700">
            <button id="tabCreateBtn" class="px-8 py-2.5 bg-indigo-600 text-white font-bold rounded-full shadow-lg transition active:scale-95">
                ➕ 新建房間
            </button>
            <button id="tabListBtn" class="px-8 py-2.5 bg-transparent text-slate-400 font-bold rounded-full hover:text-white transition active:scale-95">
                📡 現有房間
            </button>
        </div>

        <!-- 🌟 區塊 A：新建房間 (預設顯示) -->
        <div id="createRoomSection" class="w-full animate-[fadeIn_0.3s_ease-out]">
            <h1 class="text-3xl font-bold mb-8 text-center bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                🎮 選擇你的遊戲
            </h1>
            
            <!-- 🌟 動態遊戲方格容器 (交給 jQuery 渲染) -->
            <div id="gameGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <div class="col-span-full text-center text-slate-500 py-10">
                    正在從伺服器載入遊戲列表...
                </div>
            </div>
        </div>

        <!-- 🌟 區塊 B：現有房間列表 (預設隱藏 hidden) -->
        <div id="roomListSection" class="hidden w-full max-w-3xl animate-[fadeIn_0.3s_ease-out]">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-slate-100 flex items-center gap-2">
                        <span>📡</span> 等待加入的房間
                    </h2>
                    <button id="refreshRoomsBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm transition">
                        🔄 重新整理
                    </button>
                </div>
                
                <!-- 列表容器 -->
                <div id="roomListContainer" class="flex flex-col gap-3">
                    <div class="text-center text-slate-500 py-4">載入中...</div>
                </div>
            </div>
        </div>

    </div>

    <!-- ================= 遊戲設定彈跳視窗 ================= -->
    <div id="gameModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-96 shadow-2xl">
            <h2 class="text-xl font-bold mb-5 text-slate-100 flex items-center gap-2">
                <span>⚙️</span> 設定「<span id="modalGameTitle"></span>」
            </h2>
            <div class="mb-6">
                <label class="block text-sm text-slate-400 mb-2">房間模式</label>
                <!-- 🌟 下拉選單改為空標籤，由 jQuery 動態塞入選項 -->
                <select id="roomModeSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
                </select>
            </div>
            <!-- 遊戲人數選單 -->
            <div class="mb-6">
                <label class="block text-sm text-slate-400 mb-2">遊玩人數</label>
                <select id="playerCountSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
                    <!-- 選項將由 jQuery 動態生成 -->
                </select>
            </div>

            <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-slate-800">
                <button id="closeModalBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm transition">取消</button>
                <button id="confirmCreateBtn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium transition">開始建立</button>
            </div>
        </div>
    </div>

    <!-- ================= jQuery 互動邏輯 ================= -->
    <script>
        $(document).ready(function() {
            let availableGames = []; // 存放從後端抓來的遊戲總表
            let selectedGameId = null;

            // --- 1. 處理頂部分頁切換邏輯 ---
            $('#tabCreateBtn').on('click', function() {
                $(this).removeClass('bg-transparent text-slate-400').addClass('bg-indigo-600 text-white shadow-lg');
                $('#tabListBtn').removeClass('bg-indigo-600 text-white shadow-lg').addClass('bg-transparent text-slate-400');
                $('#createRoomSection').removeClass('hidden');
                $('#roomListSection').addClass('hidden');
            });

            $('#tabListBtn').on('click', function() {
                $(this).removeClass('bg-transparent text-slate-400').addClass('bg-indigo-600 text-white shadow-lg');
                $('#tabCreateBtn').removeClass('bg-indigo-600 text-white shadow-lg').addClass('bg-transparent text-slate-400');
                $('#roomListSection').removeClass('hidden');
                $('#createRoomSection').addClass('hidden');
                fetchWaitingRooms(); // 切換過來時自動刷新列表
            });

            // --- 2. API 串接：抓取遊戲總表並動態渲染 ---
            function fetchGamesInfo() {
                $.ajax({
                    url: 'http://localhost:8080/api/lobby/games-info',
                    type: 'GET',
                    success: function(res) {
                        if (res.success) {
                            availableGames = res.games;
                            renderGameCards(); 
                        }
                    },
                    error: function() {
                        $('#gameGrid').html('<div class="col-span-full text-center text-red-400 py-10">無法連線到伺服器，請確認 Spring Boot 是否啟動。</div>');
                    }
                });
            }

            function renderGameCards() {
                const $grid = $('#gameGrid');
                $grid.empty();

                if (availableGames.length === 0) {
                    $grid.html('<div class="col-span-full text-center text-slate-500 py-10">目前沒有可用的遊戲！</div>');
                    return;
                }

                availableGames.forEach(game => {
                    const cardHtml = `
                        <div data-game-id="${game.gameId}" class="game-card bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-indigo-500 rounded-xl p-6 cursor-pointer transition transform hover:-translate-y-1 shadow-lg shadow-black/20">
                            <div class="text-5xl mb-4">🎮</div>
                            <h3 class="font-bold text-xl text-slate-100">${game.gameName}</h3>
                            <p class="text-slate-400 text-sm mt-2">${game.description || '經典對戰遊戲'}</p>
                        </div>
                    `;
                    $grid.append(cardHtml);
                });
            }

// --- 3. 彈窗邏輯 (點擊遊戲方塊) ---
            $('#gameGrid').on('click', '.game-card', function() {
                const gameId = $(this).data('game-id');
                selectedGameId = gameId;
                const gameData = availableGames.find(g => g.gameId === gameId);

                $('#modalGameTitle').text(gameData.gameName);

                const $modeSelect = $('#roomModeSelect');
                $modeSelect.empty();
                
                if(gameData.modes && gameData.modes.length > 0) {
                    gameData.modes.forEach(mode => {
                        $modeSelect.append(`<option value="${mode.modeCode}">${mode.modeName}</option>`);
                    });
                } else {
                    $modeSelect.append(`<option value="">無可用模式</option>`);
                }

                // 🌟 解除並重新綁定模式切換事件，確保抓到最新的 gameData
                $modeSelect.off('change').on('change', function() {
                    const selectedModeCode = $(this).val();
                    const modeInfo = gameData.modes.find(m => m.modeCode === selectedModeCode);
                    
                    const $playerSelect = $('#playerCountSelect');
                    $playerSelect.empty();
                    
                    if (modeInfo) {
                        // 判斷人數上下限，用迴圈生成選項
                        if (modeInfo.minPlayers === modeInfo.maxPlayers) {
                            $playerSelect.append(`<option value="${modeInfo.maxPlayers}">${modeInfo.maxPlayers} 人 (人數固定)</option>`);
                        } else {
                            for (let i = modeInfo.minPlayers; i <= modeInfo.maxPlayers; i++) {
                                $playerSelect.append(`<option value="${i}">${i} 人</option>`);
                            }
                        }
                    }
                });

                // 🌟 觸發一次 change 事件，讓它自動渲染第一個模式的人數選項
                $modeSelect.trigger('change');

                $('#gameModal').removeClass('hidden');
            });

            $('#closeModalBtn').on('click', function() {
                $('#gameModal').addClass('hidden');
                selectedGameId = null;
            });

            // --- 4. API 串接：建立房間 ---
            $('#confirmCreateBtn').on('click', function() {
                const currentPlayer = localStorage.getItem("playerName") || "神秘玩家";
                const modeCode = $('#roomModeSelect').val(); 
                
                // 🌟 就是漏了這行！必須先從畫面上把人數抓下來存進變數
                const playerCount = $('#playerCountSelect').val(); 
                
                if (!modeCode) {
                    alert('請選擇一個有效的遊戲模式！');
                    return;
                }

                const $btn = $(this);
                $btn.prop('disabled', true).text('建立中...');

                $.ajax({
                    url: 'http://localhost:8080/api/lobby/create-room', 
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ 
                        gameId: selectedGameId, 
                        modeCode: modeCode, 
                        // 🌟 這裡才能安全地使用 playerCount 變數
                        playerCount: parseInt(playerCount), 
                        hostName: currentPlayer 
                    }),
                    success: function(response) {
                        if (response.success) {
                            alert(response.message);
                            $('#gameModal').addClass('hidden');
                            $('#tabListBtn').click(); // 自動切換到現有房間列表
                            
                            // (如果你前面有加上 WebSocket 函數，這裡可以呼叫連線)
                            // connectToRoomWebSocket(response.roomId, currentPlayer);
                        } else {
                            alert('建立失敗：' + response.message);
                        }
                    },
                    error: function() {
                        alert('伺服器連線失敗，請檢查 Spring Boot 是否有啟動！');
                    },
                    complete: function() { 
                        // 不管成功或失敗，最後一定要把按鈕狀態還原
                        $btn.prop('disabled', false).text('開始建立'); 
                    }
                });
            });

            // --- 5. API 串接：取得等待中的房間列表 ---
            function fetchWaitingRooms() {
                $.ajax({
                    url: 'http://localhost:8080/api/lobby/rooms',
                    type: 'GET',
                    success: function(response) {
                        const $container = $('#roomListContainer');
                        $container.empty();
                        
                        if (response.rooms.length === 0) {
                            $container.append('<div class="text-center text-slate-500 py-4">目前沒有等待中的房間，自己開一局吧！</div>');
                            return;
                        }
                        
                        response.rooms.forEach(room => {
                            // 🌟 1. 查字典：用房間的 gameId 去 availableGames 陣列找對應的遊戲資料
                            const gameData = availableGames.find(g => g.gameId === room.gameId);
                            
                            // 🌟 2. 取出名字：如果有找到就顯示遊戲名稱，萬一沒找到就先顯示備用的 ID
                            const displayGameName = gameData ? gameData.gameName : '未知遊戲';

                            // 🌟 1. 計算目前人數：檢查 room.players 陣列的長度 (若無資料則為 0)
                            const currentPlayers = room.players ? room.players.length : 0;
                            
                            // 🌟 2. 判斷是否滿房
                            const isFull = currentPlayers >= room.maxPlayers;

                            // 🌟 3. 動態產生按鈕：滿房時變成灰色且不可點擊
                            let buttonHtml = '';
                            if (isFull) {
                                buttonHtml = `
                                    <button disabled class="bg-slate-700 text-slate-400 px-5 py-2 rounded-lg text-sm font-medium cursor-not-allowed border border-slate-600">
                                        房間已滿
                                    </button>
                                `;
                            } else {
                                buttonHtml = `
                                    <button onclick="joinRoom('${room.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition active:scale-95 shadow-md shadow-emerald-900/50">
                                        加入遊戲
                                    </button>
                                `;
                            }

                            const roomHtml = `
                                <div class="bg-slate-800 border border-slate-700 rounded-lg p-4 flex justify-between items-center hover:border-indigo-500 transition">
                                    <div>
                                        <!-- 🌟 3. 將原本的 room.gameId 替換成 displayGameName -->
                                        <span class="text-xs bg-indigo-600 text-white px-2 py-1 rounded mr-2">${displayGameName}</span>
                                        <span class="font-bold text-slate-200">房主: ${room.hostName}</span>
                                        <p class="text-slate-400 text-sm mt-1">模式: ${room.modeName} (${room.minPlayers}~${room.maxPlayers}人)</p>
                                        <!-- 🌟 4. 新增一行用來顯示目前人數狀態 -->
                                        <p class="text-cyan-400 text-sm font-medium mt-1">👥 房間人數: ${currentPlayers} / ${room.maxPlayers} 人</p>
                                        <p class="text-slate-500 text-xs mt-1">房號: ${room.id}</p>
                                    </div>
                                   
                                    ${buttonHtml}
                                </div>
                            `;
                            $container.append(roomHtml);
                        });
                    },
                    error: function() {
                        $('#roomListContainer').html('<div class="text-center text-red-400 py-4">無法取得房間列表，請確認伺服器連線。</div>');
                    }
                });
            }

            $('#refreshRoomsBtn').on('click', fetchWaitingRooms);

            // --- 6. API 串接：加入房間 ---
            window.joinRoom = function(roomId) {
                const currentPlayer = localStorage.getItem("playerName") || "神秘玩家";
                $.ajax({
                    url: 'http://localhost:8080/api/lobby/join-room',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ roomId: roomId, playerName: currentPlayer }),
                    success: function(res) {
                        if (res.success) {
                            alert('成功加入房間！即將進入遊戲...');
                            // window.location.href = '../poker_client.html?room=' + roomId;
                        } else {
                            alert('加入失敗：' + res.message);
                        }
                    }
                });
            };

            // 啟動！一載入網頁就去後端撈取最新的遊戲清單
            fetchGamesInfo();
        });
    </script>
</body>
</html>
